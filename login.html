<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | Tolerance Studio</title>
<meta name="description" content="Log in to your Tolerance Studio account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app/lib/supabase.js"></script>
</head>
<body>

<header class="hero auth-hero">
  <div class="wrap">
    <span class="hero-label">Welcome back</span>
    <h1>Log in.</h1>
    <p>Pick up where you left off.</p>
  </div>
</header>

<section class="sec" style="padding-top:0">
  <div class="wrap auth-wrap">
    <form class="auth-card" onsubmit="doLogin(); return false">
      <button type="button" class="btn-google" onclick="googleLogin()">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
      <p class="auth-div">or</p>
      <div class="field"><label for="email">Email</label>
        <input id="email" type="email" placeholder="you@company.com" required autocomplete="email"></div>
      <div class="field"><label for="pw">Password</label>
        <input id="pw" type="password" placeholder="••••••••" required autocomplete="current-password"></div>
      <button class="btn btn-primary auth-btn" id="go" type="submit">Log in &rarr;</button>
      <p class="auth-status" id="status" role="status"></p>
      <p class="auth-alt">New here? <a href="signup.html">Sign up free</a></p>
    </form>
  </div>
</section>

<footer>
  <div class="wrap">
    <div>Tolerance Studio &middot; product imagery studio</div>
    <div class="footer-links">
      <a href="contact.html">Contact</a>
    </div>
  </div>
</footer>

<script>
function nextUrl(){
  var n = new URLSearchParams(location.search).get('next');
  // relative paths only — never bounce to another origin
  return (n && !/^([a-z]+:)?\/\//i.test(n)) ? n : 'app/2-project-list.html';
}
(async function(){
  var s = await sb.auth.getSession();
  if (s.data.session) location.href = nextUrl();
})();
async function googleLogin(){
  var status = document.getElementById('status');
  status.textContent = 'opening Google…';
  // Come back to this page with ?next= intact; the getSession check above
  // then forwards into the app.
  var back = location.origin + location.pathname + location.search;
  var r = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: back } });
  if (r.error) status.textContent = r.error.message;
}
async function doLogin(){
  var status = document.getElementById('status');
  var btn = document.getElementById('go');
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('pw').value;
  btn.disabled = true; status.textContent = 'signing in…';
  var r = await sb.auth.signInWithPassword({ email: email, password: password });
  if (r.error){ btn.disabled = false; status.textContent = r.error.message; return false; }
  location.href = nextUrl();
  return false;
}
</script>
<script src="assets/nav.js"></script>
</body>
</html>
